[package]
name = "locked_in"
version = "0.1.0"
description = "Kinlog Locked In: SKR deposit challenge with ORE-round rewards"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "locked_in"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = "1.2.0"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
litesvm = "0.16.0"
solana-account = "4.3.0"
solana-message = "4.2.4"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
